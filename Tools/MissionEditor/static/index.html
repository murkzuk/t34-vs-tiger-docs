<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TvT Mission Editor</title>
<style>
  :root {
    --bg:#14171a; --panel:#1b1f23; --panel2:#242a2f; --ink:#e7eae7;
    --ink2:#a4acb1; --ink3:#798187; --rule:#333a40;
    --friend:#9aa3a8; --enemy:#5f9e57; --nav:#d8a947; --sel:#e0a33a;
    --ok:#64c291; --bad:#e28874;
    --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font:13px/1.5 system-ui,"Segoe UI",sans-serif; overflow:hidden; }
  #app { display:flex; height:100%; }
  #view { flex:1; position:relative; }
  canvas { display:block; }

  #side { width:310px; background:var(--panel); border-left:1px solid var(--rule);
    display:flex; flex-direction:column; overflow:hidden; }
  .sec { border-bottom:1px solid var(--rule); padding:11px 13px; }
  .sec h2 { margin:0 0 8px; font-size:10.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink3); font-weight:600; }
  .grow { flex:1; overflow-y:auto; }

  select,button { background:var(--panel2); color:var(--ink);
    border:1px solid var(--rule); border-radius:3px; padding:5px 8px;
    font:inherit; cursor:pointer; }
  button:hover { border-color:var(--ink3); }
  button:disabled { opacity:.4; cursor:default; }
  select { width:100%; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  .row > * { flex:1; }

  label.chk { display:flex; align-items:center; gap:7px; padding:3px 0;
    color:var(--ink2); cursor:pointer; font-size:12.5px; }
  label.chk input { accent-color:#85b4d2; }

  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px;
    font-family:var(--mono); font-size:11.5px; }
  .kv span:nth-child(odd) { color:var(--ink3); }
  .num { font-variant-numeric:tabular-nums; }

  #list { font-family:var(--mono); font-size:11px; }
  #list div { padding:2px 5px; border-radius:2px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #list div:hover { background:var(--panel2); }
  #list div.on { background:#2f5169; color:#fff; }

  #hud { position:absolute; left:12px; top:12px; font-family:var(--mono);
    font-size:11.5px; color:var(--ink2); background:rgba(20,23,26,.82);
    border:1px solid var(--rule); border-radius:4px; padding:8px 11px;
    pointer-events:none; line-height:1.7; }
  #hud b { color:var(--ink); font-weight:600; }
  #msg { position:absolute; left:12px; bottom:12px; font-family:var(--mono);
    font-size:11.5px; padding:7px 11px; border-radius:4px;
    background:rgba(20,23,26,.9); border:1px solid var(--rule); max-width:60%; }
  .good { color:var(--ok); } .bad { color:var(--bad); }
  #legend { position:absolute; right:12px; top:12px; font-family:var(--mono);
    font-size:11px; color:var(--ink2); background:rgba(20,23,26,.82);
    border:1px solid var(--rule); border-radius:4px; padding:8px 11px;
    pointer-events:none; }
  #legend i { display:inline-block; width:9px; height:9px; margin-right:6px;
    border-radius:2px; vertical-align:middle; }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="hud">loading…</div>
    <div id="legend"></div>
    <div id="msg">&nbsp;</div>
  </div>

  <div id="side">
    <div class="sec">
      <h2>Mission</h2>
      <select id="pick"></select>
      <div class="row" style="margin-top:7px">
        <button id="reload">Reload</button>
        <button id="save" disabled>Save</button>
      </div>
    </div>

    <div class="sec">
      <h2>Show</h2>
      <label class="chk"><input type="checkbox" id="cRouter"> Router map — where you can drive</label>
      <label class="chk"><input type="checkbox" id="cTerrain"> Terrain map — what you see</label>
      <label class="chk"><input type="checkbox" id="cRoute" checked> Advance route</label>
      <label class="chk"><input type="checkbox" id="cNav" checked> Navpoints</label>
      <label class="chk"><input type="checkbox" id="cScenery"> Scenery &amp; interiors</label>
      <label class="chk"><input type="checkbox" id="cFacing" checked> Facing lines</label>
    </div>

    <div class="sec">
      <h2>Validate</h2>
      <button id="check" style="width:100%">Check against the engine's budget</button>
      <div id="vout" style="margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--ink2)"></div>
    </div>

    <div class="sec">
      <h2>Selected</h2>
      <div id="sel" class="kv"><span>—</span><span></span></div>
    </div>

    <div class="sec grow">
      <h2>Objects</h2>
      <div id="list"></div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
